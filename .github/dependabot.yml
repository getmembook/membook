version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Grouped aggressively: ungrouped, this opened seven PRs on the first run.
    # A two-package repo with 155 tests can review a batch as one change.
    groups:
      # Majors split out from routine updates. Grouped together, a TypeScript
      # 7 migration held vitest 4 and @types/node hostage in one all-or-nothing
      # PR that failed every job — so nothing could land, and each reopening
      # cost a full matrix. Routine bumps should merge on green; majors should
      # arrive one at a time and be argued with individually.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    # Majors that would raise the Node floor are refused on sight, so letting
    # Dependabot reopen them costs a full CI matrix to reject a decision that
    # was already made. execa 10 and better-sqlite3 13 both require Node >=22;
    # this repo supports 20, and a support-policy change must be a deliberate
    # commit rather than a side effect of a dependency bump.
    ignore:
      - dependency-name: execa
        update-types: ["version-update:semver-major"]
      - dependency-name: better-sqlite3
        update-types: ["version-update:semver-major"]
      - dependency-name: commander
        update-types: ["version-update:semver-major"]
      # @types/node must track the MINIMUM supported runtime, not the latest.
      # We declare engines.node >=20; on v26, code using a Node 22+ API would
      # typecheck and then fail at runtime on Node 20, with CI green. Bump this
      # only when the support floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks the build toolchain, not our code: tsup's dts step
      # (rollup-plugin-dts) reaches into TS internals that changed in 7. REMOVE
      # this ignore once tsup/rollup-plugin-dts support TypeScript 7 — we do
      # want the upgrade, we just cannot build under it yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: scope
