version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Grouped aggressively: ungrouped, this opened seven PRs on the first run.
    # A two-package repo with 155 tests can review a batch as one change.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["major", "minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore"
      include: scope
