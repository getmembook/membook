name: Bug report
description: Something behaves differently than documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/getmembook/membook/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >
        The smallest case that shows it. A failing test is ideal — this repo
        makes strong claims about determinism and round-tripping, so a case
        that breaks one is genuinely useful.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Full message and stack trace, if any.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, pnpm version.
      placeholder: "macOS 15.5, Node 24.1.0, pnpm 9.15.0"
    validations:
      required: true
