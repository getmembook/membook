name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 20 is the floor declared in `engines`; 24 is what the repo pins.
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup errors out when the
      # version is pinned both in the action and in package.json's
      # `packageManager` field, so that field is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Tests run from source, so this must pass without a prior build —
      # it is the check that a fresh clone works.
      - run: pnpm test

      - run: pnpm build
      - run: pnpm typecheck

  # Windows is built but deliberately not gated on, per CLAUDE.md.
  windows:
    name: build (windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. pnpm/action-setup errors out when the
      # version is pinned both in the action and in package.json's
      # `packageManager` field, so that field is the single source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
