name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MINUTES ARE METERED WHILE THIS REPO IS PRIVATE, AND macOS COSTS 10x.
  #
  # Private repos bill Linux at 1x, Windows at 2x and macOS at 10x. Two macOS
  # jobs on every pull-request update came to roughly 1,700 minutes a week on
  # their own — effectively the whole allowance, spent on a multiplier rather
  # than on coverage. A PR gets pushed to many times; main is merged to rarely.
  #
  # Going public makes all of this free and both jobs below collapse back into
  # one matrix.
  test:
    name: test (ubuntu-latest, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in `engines`; 24 is what the repo pins.
        node: [20, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose. pnpm/action-setup errors out when the
      # version is pinned both in the action and in package.json's
      # `packageManager` field, so that field is the single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Tests run from source, so this must pass without a prior build —
      # it is the check that a fresh clone works.
      - run: pnpm test

      - run: pnpm build
      - run: pnpm typecheck

  # macOS on merges to main only — see the note above.
  #
  # The trade is honest: a macOS-only failure is caught after merge instead of
  # before. It is small here because development happens on a Mac, so the
  # author's own `pnpm test` is already a macOS run on every change; CI was
  # paying a 10x multiplier to repeat a check that had just happened locally.
  # If development ever moves off macOS, this needs revisiting.
  macos:
    name: test (macos-latest, node ${{ matrix.node }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm typecheck

  # Windows is built but deliberately not gated on, per CLAUDE.md.
  windows:
    name: build (windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # No `version:` here on purpose. pnpm/action-setup errors out when the
      # version is pinned both in the action and in package.json's
      # `packageManager` field, so that field is the single source of truth.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # The "works locally, broken from the registry" class of failure.
  #
  # `npm pack` once shipped `workspace:*` unresolved, so the install failed and
  # the binary never linked — `npx membook` silently did nothing. Nothing in
  # the test suite could see it, because the suite runs from source. This packs
  # like a release, installs like a user, and runs the binary.
  packaged:
    name: packaged install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # pnpm pack, not npm pack: only pnpm resolves the workspace protocol.
      - name: Pack every package
        run: |
          mkdir -p /tmp/pkg
          for p in spec core mcp cli; do
            (cd packages/$p && pnpm pack --pack-destination /tmp/pkg)
          done

      - name: No unresolved workspace protocol in any tarball
        run: |
          for f in /tmp/pkg/*.tgz; do
            if tar -xzOf "$f" package/package.json | grep -q '"workspace:'; then
              echo "::error::$f ships an unresolved workspace protocol"
              exit 1
            fi
          done

      - name: Install as a user would, and run the binary
        run: |
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install /tmp/pkg/membook-spec-*.tgz /tmp/pkg/membook-core-*.tgz \
                      /tmp/pkg/membook-mcp-*.tgz /tmp/pkg/membook-0*.tgz
          test -x node_modules/.bin/membook || { echo "::error::binary did not link"; exit 1; }
          ./node_modules/.bin/membook --version

      - name: The book a packaged install generates is byte-identical
        run: |
          cd "$(mktemp -d)"
          git init -q --initial-branch=main
          git config user.email ci@example.test && git config user.name CI
          mkdir -p src && echo "export const a = 1;" > src/a.ts
          git add -A && git commit -qm "init"
          npm init -y >/dev/null
          npm install /tmp/pkg/membook-spec-*.tgz /tmp/pkg/membook-core-*.tgz \
                      /tmp/pkg/membook-mcp-*.tgz /tmp/pkg/membook-0*.tgz >/dev/null
          ./node_modules/.bin/membook init >/dev/null
          cp MEMBOOK.md /tmp/book-first.md
          ./node_modules/.bin/membook book >/dev/null
          diff /tmp/book-first.md MEMBOOK.md
